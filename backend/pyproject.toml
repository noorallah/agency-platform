[project]
name = "agency-platform-backend"
version = "1.0.1"
description = "Enterprise agency management system backend."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "fastapi>=0.115,<1.0",
    "openpyxl>=3.1,<4.0",
    "PyJWT>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyMySQL>=1.1,<2.0",
    # Pure Python, so the Windows installer stays free of system
    # dependencies -- WeasyPrint would drag GTK and Pango behind it.
    "reportlab>=4.2,<5.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "black>=24.10,<26.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]
# The release build, and nothing else. Separate from `dev` because it is
# installed on a build machine rather than on a developer's, and because a
# customer machine must receive neither: `uv sync` with no group is what the
# installer and start_backend.ps1 run, and it takes only the runtime
# dependencies above.
#
# Nuitka translates Python to C and compiles it, which is what makes the
# shipped backend something a customer cannot simply read. It needs a C
# compiler on the build machine -- MSVC, which Nuitka will offer to fetch as
# MinGW if none is found.
build = [
    # 4.2 is the floor because this tree runs on Python 3.14, which earlier
    # Nuitka releases do not support. That was worth checking rather than
    # assuming: the plan allowed for building the release against 3.13 if it
    # turned out not to be ready.
    "nuitka>=4.2,<5.0",
    # Renders docs/INSTALL_GUIDE.md into the HTML page that ships beside
    # Setup.exe and in the installed copy's Start menu (packaging/render_guide.py).
    "markdown>=3.7,<4.0",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# reportlab ships no type information. The renderer is the only module that
# touches it and is covered by its own tests, so the alternative -- a stub
# package to maintain for one drawing library -- buys nothing.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
