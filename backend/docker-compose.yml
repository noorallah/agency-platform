name: agency-platform

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: agency_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AGENCY_DATABASE_PASSWORD:?set AGENCY_DATABASE_PASSWORD}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agency_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - config/.env
    environment:
      AGENCY_DATABASE_DIALECT: postgresql
      AGENCY_DATABASE_HOST: postgres
      AGENCY_DATABASE_PORT: 5432
      AGENCY_DATABASE_NAME: agency_platform
      AGENCY_DATABASE_USERNAME: postgres
      AGENCY_DATABASE_PASSWORD: ${AGENCY_DATABASE_PASSWORD:?set AGENCY_DATABASE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # refresh_tokens, login_history, password_history and
  # tax_rule_execution_logs all grow without bound. The retention services
  # existed and nothing ran them, so this is what runs them.
  #
  # It enumerates every firm store from the registry, so it prunes dedicated
  # schemas and dedicated databases too -- doing it by hand meant knowing the
  # tenancy layout and missing a store the moment one was added.
  #
  # It is opt-in, because it deletes: bringing the stack up should not start
  # removing rows from someone who only wanted the API.
  #
  #   docker compose --profile retention up -d          # enable it
  #   AGENCY_RETENTION_MODE=--dry-run docker compose   #     --profile retention up -d                       # watch it first
  #
  # Nothing prunes these tables until you do this, so decide deliberately
  # rather than leaving it: that is how they grew unbounded in the first place.
  retention:
    profiles: ["retention"]
    build:
      context: .
    restart: unless-stopped
    env_file:
      - config/.env
    environment:
      AGENCY_DATABASE_DIALECT: postgresql
      AGENCY_DATABASE_HOST: postgres
      AGENCY_DATABASE_PORT: 5432
      AGENCY_DATABASE_NAME: agency_platform
      AGENCY_DATABASE_USERNAME: postgres
      AGENCY_DATABASE_PASSWORD: ${AGENCY_DATABASE_PASSWORD:?set AGENCY_DATABASE_PASSWORD}
      AGENCY_RETENTION_MODE: ${AGENCY_RETENTION_MODE:---yes}
      AGENCY_RETENTION_INTERVAL_SECONDS: ${AGENCY_RETENTION_INTERVAL_SECONDS:-86400}
      AGENCY_RETENTION_LOGIN_HISTORY_DAYS: ${AGENCY_RETENTION_LOGIN_HISTORY_DAYS:-365}
      AGENCY_RETENTION_EXECUTION_LOG_DAYS: ${AGENCY_RETENTION_EXECUTION_LOG_DAYS:-365}
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "while true; do uv run --no-sync python scripts/purge_retention.py            \"$$AGENCY_RETENTION_MODE\"            --login-history-days \"$$AGENCY_RETENTION_LOGIN_HISTORY_DAYS\"            --execution-log-days \"$$AGENCY_RETENTION_EXECUTION_LOG_DAYS\" || true;          sleep \"$$AGENCY_RETENTION_INTERVAL_SECONDS\"; done",
      ]

volumes:
  postgres_data:
